name: Release Docker Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    name: Build y push a Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push foilhub-api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foilhub-api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build y push foilhub-nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foilhub-nginx:${{ github.ref_name }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
