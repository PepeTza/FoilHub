version: "3.9"

services:
  nginx:
    image: ${REGISTRY}/foilhub-nginx:${TAG}
    ports:
      - target: 80
        published: 80
        mode: ingress
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

  api:
    image: ${REGISTRY}/foilhub-api:${TAG}
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: foilhub
      DB_USER: foilhub
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRES_IN: 1h
      RUN_MIGRATIONS: "true"
    secrets: [db_password, jwt_secret]
    networks: [edge, backend]
    healthcheck:
      # Liveness sin consultar la BD para que un reinicio de Postgres no tumbe todas las réplicas.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      # Sin max_attempts: en el primer deploy Postgres puede tardar en inicializar y
      # `migrate deploy` falla hasta que esté listo; con un tope la API quedaría en 0/3.
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foilhub
      POSTGRES_USER: foilhub
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foilhub -d foilhub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.db == true]
      restart_policy:
        condition: on-failure

  visualizer:
    image: dockersamples/visualizer:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints: [node.role == manager]

networks:
  edge:
    driver: overlay
  backend:
    driver: overlay
    internal: true

volumes:
  db_data:

secrets:
  db_password:
    external: true
  jwt_secret:
    external: true
